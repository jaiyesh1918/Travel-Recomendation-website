<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1>Contact Us</h1>
  </header>

  <section class="content">
    <p>We’d love to hear from you! Please use the form below to get in touch with us.</p>
    
    <form id="contact-form">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="Your email address">
      
      <label for="message">Message:</label>
      <textarea id="message" name="message" required placeholder="Your message"></textarea>
      
      <button type="submit">Submit</button>
    </form>
  </section>
<script>document.getElementById("contact-form").addEventListener("submit", function (event) {
    event.preventDefault();
    alert("Thank you for reaching out! We will get back to you soon.");
  });
  </script>
  <footer style="background-color: rgb(17, 74, 181);">
    <p>&copy; 2024 Travel Explorer. All rights reserved.</p>
  </footer>
</body>
</html>
